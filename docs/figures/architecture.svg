<rect width="1100" height="700" fill="#ffffff"/>
<text x="40" y="44" font-size="20" fill="#16191f" font-weight="700" text-anchor="start">E-DBA v4 · system architecture</text>
<text x="40" y="66" font-size="12.5" fill="#5d6573" font-weight="400" text-anchor="start">One FastAPI process, layered: presentation → services → domain → persistence; outbound connectors to member systems.</text>
