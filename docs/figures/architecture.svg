<text x="264" y="439" font-size="10.5" fill="#5d6573" font-weight="400" text-anchor="start">+ search</text>
<rect x="456" y="390" width="192" height="54" rx="8" fill="#f0f2f5" stroke="#d5dae1" stroke-width="1.4"/>
<text x="468" y="410" font-size="13" fill="#16191f" font-weight="700" text-anchor="start" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">policies</text>
