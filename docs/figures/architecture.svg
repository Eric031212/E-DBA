<text x="800" y="638" font-size="11.5" fill="#5d6573" font-weight="400" text-anchor="middle">audit_events chained by prev_hash</text>
<text x="800" y="654" font-size="11.5" fill="#5d6573" font-weight="400" text-anchor="middle">bank secrets Fernet-encrypted at rest</text>
