<text x="48" y="543" font-size="12" fill="#16191f" font-weight="400" text-anchor="start">level 1 elsewhere; services carry a min level</text>
<rect x="560" y="482" width="510" height="76" rx="12" fill="#fff" stroke="#c9cfd8" stroke-width="1.4"/>
<text x="578" y="504" font-size="11" fill="#5d6573" font-weight="700" text-anchor="start">MODELS (SQLAlchemy 2.0, typed)</text>
<text x="578" y="526" font-size="12" fill="#16191f" font-weight="400" text-anchor="start">17 tables · money in integer cents · UTC timestamps</text>
<text x="578" y="543" font-size="12" fill="#16191f" font-weight="400" text-anchor="start">Alembic migrations · SQLite (dev) / PostgreSQL (prod)</text>
<path d="M800 558 L800 590" fill="none" stroke="#8a93a3" stroke-width="1.6" marker-end="url(#a-g)"/>
<rect x="640" y="590" width="320" height="74" rx="12" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.4"/>
