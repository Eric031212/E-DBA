[project]
name = "edba"
version = "4.0.0"
description = "Education Data Bay Area: a policy-driven, multi-tenant data-sharing platform for higher education"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "E-DBA team, BNBU" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "cryptography>=42",
    "pyjwt>=2.8",
    "openpyxl>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
edba = "edba.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101", "B008", "RUF012", "S311", "RUF001", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/edba/gateway/**" = ["S105"]
"src/edba/seed.py" = ["S105", "S106"]
"scripts/**" = ["S603", "S607", "S310"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
